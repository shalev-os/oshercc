name: Trigger Linux deployment

on:
  workflow_run:
    workflows: [Validate static site]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      id-token: write
    steps:
      - name: Notify Linux deployment service
        run: |
          set -euo pipefail
          token=$(curl --silent --show-error --fail --max-time 15 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fosher.cc%2F_ops%2Fdeploy" | jq -er .value)
          echo "::add-mask::$token"
          code=$(curl --silent --show-error --fail --max-time 20 -o /dev/null -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $token" https://osher.cc/_ops/deploy)
          test "$code" = 202
