name: Validate static site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-osher-cc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and package site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate site
        run: |
          set -euo pipefail
          node scripts/check-static-site.mjs
          npx --no-install tsc --noEmit --project tsconfig.app.json
          npm run test --if-present
          npm run build
          test -s dist/index.html
          # Keep the existing IIS configuration managed on the server.
          if [[ -f dist/web.config && ! -L dist/web.config ]]; then rm -- dist/web.config; fi
          test -z "$(find dist -iname web.config -print -quit)"
          test -z "$(find dist -type l -print -quit)"
          size=$(du -sb dist | cut -f1)
          test "$size" -le 104857600
          test -z "$(find dist -type f -size +50M -print -quit)"

      - name: Package production build
        run: |
          set -euo pipefail
          (cd dist && zip -q -r ../site.zip .)
          test "$(stat -c '%s' site.zip)" -le 104857600

      - name: Upload immutable build artifact
        id: release-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}-${{ github.run_attempt }}
          path: site.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false

