name: Validate and deploy to IIS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-osher-cc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and package site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.release-artifact.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate site
        run: |
          set -euo pipefail
          node scripts/check-static-site.mjs
          npx --no-install tsc --noEmit --project tsconfig.app.json
          npm run test --if-present
          npm run build
          test -s dist/index.html
          # Keep the existing IIS configuration managed on the server.
          if [[ -f dist/web.config && ! -L dist/web.config ]]; then rm -- dist/web.config; fi
          test -z "$(find dist -iname web.config -print -quit)"
          test -z "$(find dist -type l -print -quit)"
          size=$(du -sb dist | cut -f1)
          test "$size" -le 104857600
          test -z "$(find dist -type f -size +50M -print -quit)"

      - name: Package production build
        run: |
          set -euo pipefail
          (cd dist && zip -q -r ../site.zip .)
          test "$(stat -c '%s' site.zip)" -le 104857600

      - name: Upload immutable build artifact
        id: release-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}-${{ github.run_attempt }}
          path: site.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false

  deploy:
    name: Deploy signed release
    needs: build
    if: github.repository == 'shalev-os/oshercc' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: deploy-osher-cc
      cancel-in-progress: false
    steps:
      # This job never checks out or executes repository code.
      - name: Download the exact build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error

      - name: Send signed build to the deployment endpoint
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DEPLOY_HMAC_KEY: ${{ secrets.DEPLOY_HMAC_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_URL"
          test "${DEPLOY_URL#https://}" != "$DEPLOY_URL"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          test -n "$DEPLOY_HMAC_KEY"
          test -f release/site.zip
          test ! -L release/site.zip
          size=$(stat -c '%s' release/site.zip)
          test "$size" -gt 0
          test "$size" -le 104857600
          digest=$(sha256sum release/site.zip | cut -d' ' -f1)
          timestamp=$(date -u +%s)
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          canonical=$(printf 'v1\n%s\n%s\n%s\n%s\n%s\n%s' \
            "$timestamp" "$nonce" "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" "$digest")
          signature=$(printf '%s' "$canonical" | openssl dgst -sha256 -hmac "$DEPLOY_HMAC_KEY" | sed 's/^.*= //')
          curl --silent --show-error --fail --output /dev/null \
            --write-out 'Deployment HTTP status: %{http_code}\n' \
            --connect-timeout 10 --max-time 300 \
            -X POST "$DEPLOY_URL/v1/deploy" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'Content-Type: application/zip' \
            -H "X-Deploy-Timestamp: $timestamp" \
            -H "X-Deploy-Nonce: $nonce" \
            -H "X-Deploy-Repository: $GITHUB_REPOSITORY" \
            -H "X-Deploy-Ref: $GITHUB_REF" \
            -H "X-Deploy-SHA: $GITHUB_SHA" \
            -H "X-Deploy-Archive-SHA256: $digest" \
            -H "X-Deploy-Signature: $signature" \
            --data-binary @release/site.zip

      - name: Check public availability
        # Receiver rollback covers local health checks; a failure here does not roll back.
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --max-time 30 https://osher.cc/ --output /dev/null
          curl --silent --show-error --fail --location --max-time 30 https://mazonhaosher.co.il/ --output /dev/null
